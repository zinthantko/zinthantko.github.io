    <title>ZComics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f0e;
        --bg-soft: #0e1513;
        --card: #121a17;
        --card-2: #16211d;
        --line: #22312b;
        --text: #eaf4f0;
        --muted: #96aca2;
        --faint: #63766d;
        --teal: #00b8a9;
        --teal-bright: #2fe0cf;
        --teal-deep: #00796e;
        --amber: #f0a13c;
        --radius: 14px;
        --topbar-h: 56px;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Padauk", "Noto Sans Myanmar", "Myanmar Text", system-ui, sans-serif;
        line-height: 1.65;
        padding-bottom: env(safe-area-inset-bottom);
      }
      button { font: inherit; cursor: pointer; }
      a { color: var(--teal-bright); }
      img { display: block; max-width: 100%; }

      /* ---------- Top bar ---------- */
      .topbar {
        position: sticky; top: 0; z-index: 40;
        height: var(--topbar-h);
        display: flex; align-items: center; gap: 10px;
        padding: 0 14px;
        padding-top: env(safe-area-inset-top);
        background: rgba(10, 15, 14, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
      .brand img { width: 42px; height: 42px; border-radius: 10px; flex: none; object-fit: cover; background: #17251f; }
      .brand .name {
        font-weight: 700; font-size: 19px; color: var(--teal); letter-spacing: 0.01em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .topbar .icon-btn {
        flex: none; display: inline-flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; border-radius: 10px;
        background: var(--card); border: 1px solid var(--line); color: var(--text);
        text-decoration: none;
      }
      .topbar .icon-btn svg { width: 20px; height: 20px; }
      .back-btn {
        flex: none; display: none; align-items: center; gap: 4px;
        background: var(--card); border: 1px solid var(--line); color: var(--text);
        border-radius: 10px; padding: 8px 12px 8px 8px; min-height: 40px; font-size: 14px;
      }
      .back-btn svg { width: 18px; height: 18px; }
      .back-btn.show { display: inline-flex; }
      .view-title {
        display: none; flex: 1; min-width: 0;
        font-weight: 700; font-size: 16px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .view-title.show { display: block; }
      body.subview .brand { display: none; }
      body.subview .view-title { display: block; }

      main { max-width: 1060px; margin: 0 auto; padding: 0 14px 40px; }
      .view { display: none; }
      .view.active { display: block; animation: viewIn .18s ease-out; }
      @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .view.active { animation: none; } }

      /* ---------- Search & genres ---------- */
      .search-wrap { position: relative; margin: 16px 0 12px; }
      .search-wrap svg {
        position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
        width: 19px; height: 19px; color: var(--faint); pointer-events: none;
      }
      #search {
        width: 100%; font: inherit; font-size: 16px; color: var(--text);
        background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: 11px 14px 11px 42px; outline: none;
      }
      #search:focus { border-color: var(--teal); }
      #search::placeholder { color: var(--faint); }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 6px; }
      .chips.types { padding-top: 0; }
      .chips.types .chip.on { background: var(--teal-deep); border-color: var(--teal-deep); color: #eafffb; }
      .chip {
        flex: none; background: var(--card); color: var(--muted);
        border: 1px solid var(--line); border-radius: 999px;
        padding: 7px 16px; font-size: 14.5px; min-height: 38px;
      }
      .chip.on { background: var(--teal); border-color: var(--teal); color: #04211d; font-weight: 700; }

      /* ---------- Featured ---------- */
      .featured {
        position: relative; margin-top: 10px; border-radius: 18px; overflow: hidden;
        border: 1px solid var(--line); cursor: pointer; background: var(--card);
      }
      .featured .art { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: center 30%; }
      .featured .shade {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(5, 10, 9, 0.94) 22%, rgba(5, 10, 9, 0.35) 55%, rgba(5, 10, 9, 0) 78%);
      }
      .featured .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; }
      .featured .kicker { color: var(--teal-bright); font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
      .featured h2 { margin: 2px 0 6px; font-size: clamp(21px, 5.6vw, 30px); line-height: 1.35; }
      .featured .meta { color: #cfe0d9; font-size: 14px; margin-bottom: 12px; }
      .read-cta {
        display: inline-flex; align-items: center; gap: 7px;
        background: var(--teal); color: #04211d; border: 0; border-radius: 10px;
        font-weight: 700; font-size: 15px; padding: 10px 18px; min-height: 44px;
      }
      .read-cta svg { width: 18px; height: 18px; }
      @media (min-width: 760px) { .featured .art { aspect-ratio: 21 / 9; } }

      /* ---------- Section heads ---------- */
      .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
      .sec-head h3 { margin: 0; font-size: 19px; }
      .sec-head .count { color: var(--faint); font-size: 13.5px; }

      /* ---------- Series grid ---------- */
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
      @media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }
      @media (min-width: 940px) { .grid { grid-template-columns: repeat(4, 1fr); } }
      .series-card {
        background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
        overflow: hidden; cursor: pointer; text-align: left; padding: 0; color: var(--text); width: 100%;
      }
      .series-card .cover { position: relative; }
      .series-card .cover img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: center 22%; }
      .badge {
        position: absolute; top: 8px; left: 8px;
        font-size: 12px; font-weight: 700; line-height: 1;
        padding: 5px 9px; border-radius: 999px;
      }
      .badge.serial { background: var(--teal); color: #04211d; }
      .badge.oneshot { background: var(--amber); color: #2a1802; }
      .series-card .body { padding: 10px 12px 12px; }
      .series-card h4 { margin: 0 0 3px; font-size: 15.5px; line-height: 1.45; }
      .series-card .sub { color: var(--muted); font-size: 13px; }

      .empty-note {
        border: 1px dashed var(--line); border-radius: var(--radius);
        color: var(--muted); text-align: center; padding: 26px 16px; font-size: 15px;
      }

      /* ---------- Ad slots ---------- */
      .ad-slot {
        margin: 22px 0 4px; min-height: 96px;
        border: 1px dashed #2c423a; border-radius: var(--radius);
        display: flex; align-items: center; justify-content: center;
        color: var(--faint); font-size: 13px; background: var(--bg-soft);
        overflow: hidden;
      }
      .ad-slot::after { content: "ကြော်ငြာ"; letter-spacing: 0.35em; text-indent: 0.35em; }
      .ad-slot.filled { border: 0; min-height: 0; background: transparent; }
      .ad-slot.filled::after { content: none; }

      /* ---------- Sticky bottom ad ---------- */
      .sticky-ad {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
        padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
        background: rgba(10, 15, 14, 0.96); border-top: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }
      .sticky-ad[hidden] { display: none; }
      .sticky-ad .ad-slot { margin: 0; min-height: 54px; max-height: 92px; }
      .sticky-ad .ad-close {
        position: absolute; top: -13px; right: 10px; z-index: 2;
        width: 26px; height: 26px; border-radius: 50%;
        background: var(--card-2); border: 1px solid var(--line); color: var(--muted);
        display: inline-flex; align-items: center; justify-content: center; padding: 0;
      }
      .sticky-ad .ad-close svg { width: 13px; height: 13px; }
      body.has-sticky { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }

      /* ---------- Ad gate (popup — ကြည့်ပြီးမှ ဖတ်ရန်) ---------- */
      .gate {
        position: fixed; inset: 0; z-index: 90; display: none;
        align-items: center; justify-content: center; padding: 16px;
        background: rgba(4, 8, 7, 0.9); backdrop-filter: blur(4px);
      }
      .gate.open { display: flex; }
      .gate-card {
        width: min(440px, 100%); max-height: 92dvh; overflow-y: auto;
        background: var(--card); border: 1px solid var(--line); border-radius: 18px;
        padding: 18px; animation: viewIn .18s ease-out;
      }
      @media (prefers-reduced-motion: reduce) { .gate-card { animation: none; } }
      .gate-tag {
        display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
        color: var(--amber); border: 1px solid rgba(240, 161, 60, 0.45);
        background: rgba(240, 161, 60, 0.12); border-radius: 999px; padding: 3px 11px;
      }
      .gate-card h3 { margin: 10px 0 4px; font-size: 19px; line-height: 1.5; }
      .gate-sub { color: var(--muted); font-size: 14px; margin: 0; }
      .gate-card .ad-slot { margin: 14px 0 10px; min-height: 240px; }
      .gate-count { text-align: center; color: var(--teal-bright); font-size: 14.5px; font-weight: 700; min-height: 24px; }
      .gate-bar { height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 6px 0 14px; }
      .gate-bar span { display: block; height: 100%; width: 0; background: var(--teal); border-radius: 999px; transition: width .15s linear; }
      .gate-actions { display: flex; gap: 10px; }
      .gate-actions button {
        flex: 1; min-height: 48px; border-radius: 12px; font-size: 15px; font-weight: 700; padding: 10px 8px;
      }
      .gate-cancel { background: var(--card-2); border: 1px solid var(--line); color: var(--text); }
      .gate-continue { background: var(--teal); border: 1px solid var(--teal); color: #04211d; }
      .gate-continue:disabled { opacity: 0.38; cursor: default; }

      /* ---------- Locked reader panel ---------- */
      .locked-panel {
        margin: 22px 0 4px; text-align: center;
        border: 1px dashed var(--line); border-radius: var(--radius);
        padding: 30px 18px; background: var(--bg-soft);
      }
      .locked-panel .lock-ic {
        width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 50%;
        background: rgba(0, 184, 169, 0.12); border: 1px solid rgba(0, 184, 169, 0.4);
        display: flex; align-items: center; justify-content: center; color: var(--teal-bright);
      }
      .locked-panel .lock-ic svg { width: 24px; height: 24px; }
      .locked-panel p { color: var(--muted); font-size: 14.5px; margin: 4px 0 16px; }

      /* ---------- Series detail ---------- */
      .detail-hero { margin: 14px -14px 0; position: relative; }
      .detail-hero img { width: 100%; max-height: 46vh; object-fit: cover; object-position: center 25%; }
      .detail-hero .shade {
        position: absolute; inset: 0;
        background: linear-gradient(to top, var(--bg) 4%, rgba(10, 15, 14, 0) 55%);
      }
      @media (min-width: 700px) { .detail-hero { margin: 14px 0 0; border-radius: 18px; overflow: hidden; } .detail-hero .shade { background: linear-gradient(to top, rgba(10,15,14,.55), rgba(10,15,14,0) 55%); } }
      .detail-body { padding-top: 6px; }
      .detail-body h2 { margin: 8px 0 6px; font-size: clamp(21px, 5.4vw, 28px); line-height: 1.4; }
      .tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; }
      .tag {
        font-size: 13px; padding: 4px 11px; border-radius: 999px;
        border: 1px solid var(--line); color: var(--muted); background: var(--card);
      }
      .tag.teal { background: rgba(0, 184, 169, 0.14); border-color: rgba(0, 184, 169, 0.45); color: var(--teal-bright); font-weight: 700; }
      .tag.amber { background: rgba(240, 161, 60, 0.13); border-color: rgba(240, 161, 60, 0.45); color: var(--amber); font-weight: 700; }
      .credit { color: var(--muted); font-size: 14.5px; margin: 6px 0 0; }
      .credit a { font-weight: 700; text-decoration: none; }
      .plan-note {
        margin-top: 12px; background: rgba(0, 184, 169, 0.08);
        border: 1px solid rgba(0, 184, 169, 0.3); border-radius: var(--radius);
        padding: 10px 14px; font-size: 14.5px; color: #cfe8e2;
      }
      .ep-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
      .ep-row {
        display: flex; align-items: center; gap: 12px; width: 100%;
        background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 10px; color: var(--text); text-align: left; min-height: 72px;
      }
      .ep-row img { width: 46px; height: 62px; object-fit: cover; border-radius: 8px; flex: none; }
      .ep-row .ep-main { flex: 1; min-width: 0; }
      .ep-row .ep-title { font-weight: 700; font-size: 15.5px; line-height: 1.45; }
      .ep-row .ep-sub { color: var(--muted); font-size: 13px; }
      .ep-row .go {
        flex: none; display: inline-flex; align-items: center; gap: 4px;
        color: var(--teal-bright); font-size: 14px; font-weight: 700;
      }
      .ep-row .go svg { width: 17px; height: 17px; }

      /* ---------- Reader ---------- */
      .reader-head { padding-top: 14px; }
      .reader-head h2 { margin: 0 0 4px; font-size: 19px; line-height: 1.55; }
      .reader-head .rsub { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
      .reader-frame {
        margin: 12px -14px 0; background: #000; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      }
      .reader-frame iframe { display: block; width: 100%; height: calc(100dvh - 190px); min-height: 480px; border: 0; }
      @media (min-width: 700px) {
        .reader-frame { margin: 12px 0 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .reader-frame iframe { height: 78vh; }
      }
      .reader-nav { display: flex; gap: 10px; margin-top: 14px; }
      .reader-nav button {
        flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        min-height: 48px; border-radius: 12px; font-size: 15px; font-weight: 700;
        text-decoration: none; padding: 10px 8px;
      }
      .reader-nav button { background: var(--card-2); border: 1px solid var(--line); color: var(--text); }
      .reader-nav button.primary { background: var(--teal); border-color: var(--teal); color: #04211d; }
      .reader-nav button:disabled { opacity: 0.38; cursor: default; }
      .reader-nav svg { width: 18px; height: 18px; }
      .ep-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
      .ep-picker button {
        background: var(--card); border: 1px solid var(--line); color: var(--muted);
        border-radius: 999px; padding: 7px 15px; font-size: 14px; min-height: 38px;
      }
      .ep-picker button.on { background: var(--teal); border-color: var(--teal); color: #04211d; font-weight: 700; }

      .toast {
        position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
        background: var(--card-2); border: 1px solid var(--teal-deep); color: var(--text);
        border-radius: 999px; padding: 10px 18px; font-size: 14px; z-index: 60;
        transition: opacity .25s, transform .25s; max-width: 92vw; text-align: center;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

      /* ---------- App loading (network) ---------- */
      .app-loader {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: var(--bg); padding: 24px; text-align: center;
        transition: opacity .45s ease, visibility .45s;
      }
      .app-loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
      .app-loader img { width: 92px; height: 92px; border-radius: 22px; object-fit: cover; background: #17251f; }
      .app-loader .l-name { font-weight: 700; font-size: 24px; color: var(--teal); line-height: 1.3; }
      .app-loader .l-spin {
        width: 38px; height: 38px; margin-top: 10px; border-radius: 50%;
        border: 4px solid var(--line); border-top-color: var(--teal);
        animation: lspin .8s linear infinite;
      }
      @keyframes lspin { to { transform: rotate(360deg); } }
      .app-loader .l-text { color: var(--muted); font-size: 15px; }
      .app-loader .l-bar {
        width: min(240px, 70vw); height: 4px; border-radius: 999px;
        background: var(--line); overflow: hidden; margin-top: 2px;
      }
      .app-loader .l-bar::after {
        content: ""; display: block; height: 100%; width: 40%;
        background: var(--teal); border-radius: 999px;
        animation: lslide 1.2s ease-in-out infinite alternate;
      }
      @keyframes lslide { from { transform: translateX(-60%); } to { transform: translateX(210%); } }
      @media (prefers-reduced-motion: reduce) {
        .app-loader { transition: none; }
        .app-loader .l-spin { animation: none; }
        .app-loader .l-bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>

      var MY_DIGITS = ["၀", "၁", "၂", "၃", "၄", "၅", "၆", "၇", "၈", "၉"];
      function myNum(n) {
        if (n === null || n === undefined || n === "") return "";
        return String(n).replace(/[0-9]/g, function (d) { return MY_DIGITS[+d]; });
      }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      /* ---------- CSV parser (quotes, commas, newlines) ---------- */
      function parseCSV(text) {
        var rows = [], row = [], field = "", inQ = false, i, c;
        text = String(text).replace(/^\uFEFF/, "");
        for (i = 0; i < text.length; i++) {
          c = text[i];
          if (inQ) {
            if (c === '"') {
              if (text[i + 1] === '"') { field += '"'; i++; }
              else inQ = false;
            } else field += c;
          } else if (c === '"') { inQ = true; }
          else if (c === ",") { row.push(field); field = ""; }
          else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
          else if (c !== "\r") { field += c; }
        }
        if (field.length || row.length) { row.push(field); rows.push(row); }
        return rows;
      }

      function rowsToSeries(rows) {
        if (!rows || rows.length < 2) return null;
        var head = rows[0].map(function (h) { return String(h).trim().toLowerCase(); });
        var idx = {};
        ["series", "episode", "title", "pdf_url", "cover_url", "pages", "type", "genre", "series_cover"].forEach(function (k) {
          idx[k] = head.indexOf(k);
        });
        if (idx.series === -1 || idx.pdf_url === -1) return null;
        var map = {}, order = [];
        for (var r = 1; r < rows.length; r++) {
          var cells = rows[r];
          var get = function (k) { return idx[k] === -1 ? "" : String(cells[idx[k]] || "").trim(); };
          var sname = get("series");
          var pdf = get("pdf_url");
          if (!sname || !pdf) continue;
          if (!map[sname]) {
            map[sname] = {
              name: sname, nameEn: "", type: get("type") || "အပိုင်းတွဲ",
              genre: get("genre") || "ရုပ်ပြ", creator: "", telegram: "",
              cover: "", coverRemote: "", plannedNote: "", episodes: []
            };
            order.push(sname);
          }
          var s = map[sname];
          /* main poster (series_cover) ကို ပထမ ဦးစားပေး — မရှိမှသာ အပိုင်း cover ကို သုံးမည် */
          if (get("series_cover")) s.cover = get("series_cover");
          else if (!s.cover && get("cover_url")) s.cover = get("cover_url");
          if (get("type")) s.type = get("type");
          if (get("genre")) s.genre = get("genre");
          s.episodes.push({
            episode: parseInt(get("episode"), 10) || (s.episodes.length + 1),
            title: get("title") || (sname + " — အပိုင်း " + get("episode")),
            pdf_url: pdf,
            cover_url: get("cover_url"),
            pages: parseInt(get("pages"), 10) || null
          });
        }
        var list = order.map(function (n) {
          var s = map[n];
          s.episodes.sort(function (a, b) { return a.episode - b.episode; });
          return s;
        });
        return list.length ? list : null;

        var wait = Math.max(0, 500 - (Date.now() - loaderShownAt));
        setTimeout(function () {
          el.classList.add("done");
          el.setAttribute("aria-hidden", "true");
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
        }, wait);
      }
      /* Network အရမ်းနှေးလျှင် / fetch ဆိုင်းနေလျှင်လည်း loading ပိတ်ပေးမည် (seed ဒေတာဖြင့် ဆက်ပြမည်) */
      setTimeout(hideLoader, 10000);
      var views = { home: $("view-home"), series: $("view-series"), reader: $("view-reader") };

      function showView(name, title) {
        Object.keys(views).forEach(function (k) { views[k].classList.toggle("active", k === name); });
        var sub = name !== "home";
        document.body.classList.toggle("subview", sub);
        $("backBtn").classList.toggle("show", sub);
        $("viewTitle").textContent = sub ? (title || "") : "";
        window.scrollTo(0, 0);
      }

      function badgeClass(type) { return type === "တစ်ပိုင်းထဲအပြီး" ? "oneshot" : "serial"; }
      function typeBadge(type) { return '<span class="badge ' + badgeClass(type) + '">' + esc(type) + "</span>"; }
      function coverImg(s, extra) {
        var src = s.cover || (s.episodes[0] && s.episodes[0].cover_url) || "";
        var remote = s.coverRemote ? ' onerror="this.onerror=null;this.src=\'' + esc(s.coverRemote) + '\'"' : "";
        return '<img src="' + esc(src) + '" alt="' + esc(s.name) + ' မျက်နှာဖုံး"' + (extra || "") + remote + " />";
      }

      /* ---------- Home ---------- */
      function renderChips() {
        $("genreChips").innerHTML = ALL_GENRES.map(function (g) {
          return '<button class="chip' + (state.genre === g ? " on" : "") + '" data-genre="' + esc(g) + '">' + esc(g) + "</button>";
        }).join("");
        Array.prototype.forEach.call($("genreChips").querySelectorAll(".chip"), function (btn) {
          btn.addEventListener("click", function () {
            state.genre = btn.getAttribute("data-genre");
            renderChips(); renderHome();
          });
        });
        $("typeChips").innerHTML = ALL_TYPES.map(function (t) {
          return '<button class="chip' + (state.type === t ? " on" : "") + '" data-type="' + esc(t) + '">' + (t === "အားလုံး" ? "ပုံစံအားလုံး" : esc(t)) + "</button>";
        }).join("");
        Array.prototype.forEach.call($("typeChips").querySelectorAll(".chip"), function (btn) {
          btn.addEventListener("click", function () {
            state.type = btn.getAttribute("data-type");
            renderChips(); renderHome();
          });
        });
      }

      function isOneShot(s) { return s.type === "တစ်ပိုင်းထဲအပြီး"; }

      function filteredSeries() {
        var q = state.query.trim();
        return state.series.filter(function (s) {
          if (state.genre !== "အားလုံး" && s.genre !== state.genre) return false;
          if (state.type !== "အားလုံး" && s.type !== state.type) return false;
          if (q && s.name.indexOf(q) === -1 && (s.nameEn || "").toLowerCase().indexOf(q.toLowerCase()) === -1) return false;
          return true;
        });
      }

      function renderHome() {
        var list = filteredSeries();
        /* Featured: နောက်ဆုံးထွက် စီးရီး (filter မလုပ်ထားလျှင်) */
        var feat = (state.genre === "အားလုံး" && state.type === "အားလုံး" && !state.query.trim() && state.series.length) ? state.series[0] : null;
        $("featuredSlot").innerHTML = feat ? (
          '<article class="featured" id="featuredCard">' +
            coverImg(feat, ' class="art"') +
            '<div class="shade"></div>' +
            '<div class="info">' +
              '<div class="kicker">အသစ်ထွက် ဇာတ်လမ်းတွဲ</div>' +
              "<h2>" + esc(feat.name) + "</h2>" +
              '<div class="meta">' + esc(feat.genre) + " · " + esc(feat.type) + " · အပိုင်း " + myNum(feat.episodes.length) + " ပိုင်း ထွက်ရှိပြီး</div>" +
              '<button class="read-cta" id="featuredRead">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>' +
                "ဖတ်ရန်</button>" +
            "</div>" +
          "</article>"
        ) : "";
        if (feat) {
          $("featuredCard").addEventListener("click", function () { openSeries(feat.name); });
        }

        $("seriesCount").textContent = list.length ? "ဇာတ်လမ်း " + myNum(list.length) + " ခု" : "";
        $("seriesGrid").innerHTML = list.map(function (s) {
          var sub = isOneShot(s)
            ? esc(s.genre) + (s.episodes[0] && s.episodes[0].pages ? " · စာမျက်နှာ " + myNum(s.episodes[0].pages) + " မျက်နှာ" : "")
            : esc(s.genre) + " · အပိုင်း " + myNum(s.episodes.length) + " ပိုင်း";
          return '<button class="series-card" data-series="' + esc(s.name) + '">' +
            '<span class="cover">' + coverImg(s) + typeBadge(s.type) + "</span>" +
            '<span class="body">' +
              "<h4>" + esc(s.name) + "</h4>" +
              '<span class="sub">' + sub + "</span>" +
            "</span>" +
          "</button>";
        }).join("");
        $("homeEmpty").hidden = list.length !== 0;
        Array.prototype.forEach.call($("seriesGrid").querySelectorAll(".series-card"), function (card) {
          card.addEventListener("click", function () {
            var s = findSeries(card.getAttribute("data-series"));
            if (!s) return;
            /* တစ်ပိုင်းထဲအပြီး ဆိုလျှင် card မှ reader သို့ တိုက်ရိုက် (ကြော်ငြာ gate ဖြင့်) */
            if (isOneShot(s) && s.episodes.length === 1) requestRead(s.name, s.episodes[0].episode);
            else openSeries(s.name);
          });
        });
      }

      /* ---------- Series detail ---------- */
      function findSeries(name) {
        for (var i = 0; i < state.series.length; i++) if (state.series[i].name === name) return state.series[i];
        return null;
      }

      /* အက်ပ်အတွင်း သွားလာမှုကို hash history ဖြင့် တစ်ဆင့်စီ မှတ်ထားသည် —
         ဖုန်း Back နှိပ်လျှင် ဖတ်နေသော စာမျက်နှာမှ စီးရီးစာမျက်နှာ /
         စီးရီးစာမျက်နှာမှ ပင်မစာမျက်နှာသို့ ပြန်ရောက်ပြီး
         ပင်မစာမျက်နှာ၌ Back နှိပ်မှသာ အက်ပ်မှ ထွက်မည်။
         history.pushState ကို မသုံးပါ — HTML ဖိုင်ကို တိုက်ရိုက် (file://)
         run သောအခါ pushState က SecurityError ပစ်ပြီး history မတိုးသောကြောင့်
         Back နှိပ်တိုင်း အက်ပ်မှ တန်းထွက်သွားတတ်သည်။ location.hash
         ပြောင်းခြင်းကတော့ file:// တွင်ပါ history entry အစစ် တိုးပြီး
         ဘယ် browser / WebView တွင်မဆို အလုပ်လုပ်သည်။
         Loading overlay သည် history entry မဟုတ်သောကြောင့်
         Back ဖြင့် ၎င်းထံ ဘယ်တော့မှ ပြန်မရောက်ပါ။ */
      var navStack = [location.hash || "#/"]; /* အက်ပ်အတွင်း လာခဲ့သော လမ်းကြောင်း အဆင့်ဆင့် */
      var lastRouted = null; /* နောက်ဆုံး render လုပ်ထားသော hash — ထပ်ခါထပ်ခါ render မဖြစ်စေရန် */
      function currentHash() { return location.hash || "#/"; }
      function syncNav() {
        var h = currentHash();
        var n = navStack.length;
        if (navStack[n - 1] === h) return;
        if (n > 1 && navStack[n - 2] === h) navStack.pop(); /* Back ဖြင့် ပြန်လာခြင်း */
        else navStack.push(h);
      }
      function navigateTo(hash) {
        if (currentHash() === hash) { route(); return; }
        location.hash = hash; /* hashchange → route (entry အသစ် တိုးမည်) */
        setTimeout(route, 60); /* hashchange မလာသော ရှားပါး အခြေအနေအတွက် အရံအစစ် */
      }
      window.addEventListener("popstate", route);

      function openSeries(name) {
        var s = findSeries(name);
        if (!s) return;
        navigateTo("#/series/" + encodeURIComponent(name));
      }

      function renderSeries(s) {
        var eps = s.episodes.map(function (ep) {
          return '<button class="ep-row" data-ep="' + ep.episode + '">' +
            (ep.cover_url ? '<img src="' + esc(ep.cover_url) + '" alt="" loading="lazy" />' : "") +
            '<span class="ep-main">' +
              '<span class="ep-title">' + esc(ep.title) + "</span><br />" +
              '<span class="ep-sub">အပိုင်း ' + myNum(ep.episode) + (ep.pages ? " · စာမျက်နှာ " + myNum(ep.pages) + " မျက်နှာ" : "") + "</span>" +
            "</span>" +
            '<span class="go">ဖတ်ရန် ' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>' +
            "</span>" +
          "</button>";
        }).join("");

        views.series.innerHTML =
          '<div class="detail-hero">' + coverImg(s) + '<div class="shade"></div></div>' +
          '<div class="detail-body">' +
            "<h2>" + esc(s.name) + "</h2>" +
            '<div class="tags">' +
              '<span class="tag ' + badgeClass(s.type) + '">' + esc(s.type) + "</span>" +
              '<span class="tag">' + esc(s.genre) + "</span>" +
              '<span class="tag">အပိုင်း ' + myNum(s.episodes.length) + " ပိုင်း</span>" +
            "</div>" +
            (s.creator ? '<p class="credit">ဖန်တီးသူ — ' + esc(s.creator) +
              (s.telegram ? ' · <a href="https://t.me/' + esc(s.telegram.replace("@", "")) + '" target="_blank" rel="noopener">Telegram ' + esc(s.telegram) + "</a>" : "") + "</p>" : "") +
            (s.plannedNote ? '<div class="plan-note">' + esc(s.plannedNote) + "</div>" : "") +
            '<div class="sec-head"><h3>အပိုင်းများ</h3><span class="count">' + myNum(s.episodes.length) + " ပိုင်း</span></div>" +
            '<div class="ep-list">' + eps + "</div>" +
            /* ADS: စီးရီးစာမျက်နှာ banner — Mondiad Banner zone */
            '<div class="ad-slot filled" data-ad-slot="series-banner"><div data-mndbanid="c3fa4e27-30eb-44ab-ae20-c5633485bd0f"></div></div>' +
          "</div>";
        showView("series", s.name);
        Array.prototype.forEach.call(views.series.querySelectorAll(".ep-row"), function (row) {
          row.addEventListener("click", function () {
            requestRead(s.name, parseInt(row.getAttribute("data-ep"), 10));
          });
        });
      }

      /* ---------- Ad gate: ကြော်ငြာ ကြည့်ပြီးမှ ဖတ်ရန် ---------- */
      /* ကြည့်ပြီး ဖွင့်ထားသော အပိုင်းများ — ဒီ session အတွင်းသာ မှတ်ထားသည်
         (app ပိတ်ပြီး ပြန်ဖွင့်လျှင် gate ပြန်ပေါ်မည်) */
      var unlockedEps = {};
      function epKey(name, ep) { return name + "|" + ep; }
      function isUnlocked(name, ep) {
        return !ADS_CONFIG.gateEnabled || !!unlockedEps[epKey(name, ep)];
      }

      var gatePending = null; /* { series, ep } — gate ပြီးလျှင် ဖွင့်မည့် အပိုင်း */
      var gateTimer = null;

      function requestRead(seriesName, epNum) {
        if (isUnlocked(seriesName, epNum)) { openReader(seriesName, epNum); return; }
        openGate(seriesName, epNum);
      }

      function openGate(seriesName, epNum) {
        var s = findSeries(seriesName);
        if (!s) return;
        var ep = null, i;
        for (i = 0; i < s.episodes.length; i++) if (s.episodes[i].episode === epNum) ep = s.episodes[i];
        if (!ep) ep = s.episodes[0];
        gatePending = { series: seriesName, ep: ep.episode };
        $("gateSub").textContent = "“" + ep.title + "” ကို ဖတ်ရန် ကြော်ငြာကို " + myNum(ADS_CONFIG.gateSeconds) + " စက္ကန့် ကြည့်ပေးပါ။ ကြည့်ပြီးမှသာ ဖတ်နိုင်ပါမည်။";
        var gate = $("adGate");
        var cont = $("gateContinue");
        cont.disabled = true;
        gate.classList.add("open");
        document.body.style.overflow = "hidden";
        /* Countdown — ပြီးမှ "ဆက်ဖတ်ရန်" ခလုတ် ပွင့်မည် */
        var totalMs = Math.max(1, ADS_CONFIG.gateSeconds) * 1000;
        var startedAt = Date.now();
        clearInterval(gateTimer);
        var tick = function () {
          var left = totalMs - (Date.now() - startedAt);
          if (left <= 0) {
            clearInterval(gateTimer); gateTimer = null;
            $("gateBarFill").style.width = "100%";
            $("gateCount").textContent = "ကြည့်ပြီးပါပြီ — ဆက်ဖတ်နိုင်ပါပြီ ✓";
            cont.disabled = false;
            return;
          }
          $("gateBarFill").style.width = Math.round((1 - left / totalMs) * 100) + "%";
          $("gateCount").textContent = "ကြော်ငြာ ပြနေသည်… နောက် " + myNum(Math.ceil(left / 1000)) + " စက္ကန့်";
        };
        tick();
        gateTimer = setInterval(tick, 120);
      }

      function closeGate() {
        clearInterval(gateTimer); gateTimer = null;
        gatePending = null;
        $("adGate").classList.remove("open");
        document.body.style.overflow = "";
      }

      function finishGate() {
        if (!gatePending) { closeGate(); return; }
        var p = gatePending;
        unlockedEps[epKey(p.series, p.ep)] = true;
        closeGate();
        var target = "#/read/" + encodeURIComponent(p.series) + "/" + p.ep;
        if (currentHash() === target) { lastRouted = null; route(); } /* လက်ရှိ reader ကိုယ်တိုင် ပြန် render (iframe ဖွင့်ရန်) */
        else openReader(p.series, p.ep);
      }

      $("gateCancel").addEventListener("click", closeGate);
      $("gateContinue").addEventListener("click", finishGate);

      /* ---------- Sticky bottom ad ---------- */
      document.body.classList.add("has-sticky");
      $("stickyClose").addEventListener("click", function () {
        $("stickyAd").hidden = true;
        document.body.classList.remove("has-sticky");
      });

      /* ---------- Reader ---------- */
      var current = { series: null, episode: null };

      function openReader(seriesName, epNum) {
        var s = findSeries(seriesName);
        if (!s) return;
        navigateTo("#/read/" + encodeURIComponent(seriesName) + "/" + epNum);
      }

      function renderReader(s, epNum) {
        var idx = -1, i;
        for (i = 0; i < s.episodes.length; i++) if (s.episodes[i].episode === epNum) idx = i;
        if (idx === -1) idx = 0;
        var ep = s.episodes[idx];
        current = { series: s, episode: ep };

        /* ကြော်ငြာ မကြည့်ရသေးလျှင် PDF မဖွင့်သေး — gate panel ပြပြီး popup ကို တင်၍ ပြမည် */
        if (!isUnlocked(s.name, ep.episode)) {
          views.reader.innerHTML =
            '<div class="reader-head">' +
              "<h2>" + esc(ep.title) + "</h2>" +
              '<div class="rsub">' + esc(s.name) + " · အပိုင်း " + myNum(ep.episode) + (ep.pages ? " · စာမျက်နှာ " + myNum(ep.pages) + " မျက်နှာ" : "") + "</div>" +
            "</div>" +
            '<div class="locked-panel">' +
              '<div class="lock-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>' +
              "<p>ဒီအပိုင်းကို ဖတ်ရန် ကြော်ငြာ ခဏ ကြည့်ပေးပါ။<br />ကြည့်ပြီးသည်နှင့် ဖတ်နိုင်ပါမည်။</p>" +
              '<button class="read-cta" id="gateBtn">' +
                '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5-13-7.5z"/></svg>' +
                "ကြော်ငြာ ကြည့်ပြီး ဖတ်ရန်</button>" +
            "</div>" +
            /* ADS: reader အောက် banner — Mondiad Banner zone */
            '<div class="ad-slot filled" data-ad-slot="reader-banner"><div data-mndbanid="c3fa4e27-30eb-44ab-ae20-c5633485bd0f"></div></div>';
          showView("reader", ep.title);
          $("gateBtn").addEventListener("click", function () { openGate(s.name, ep.episode); });
          openGate(s.name, ep.episode);
          return;
        }

        var prev = idx > 0 ? s.episodes[idx - 1] : null;
        var next = idx < s.episodes.length - 1 ? s.episodes[idx + 1] : null;

        var picker = s.episodes.length > 1 ? (
          '<div class="ep-picker">' + s.episodes.map(function (e) {
            return '<button data-ep="' + e.episode + '"' + (e.episode === ep.episode ? ' class="on"' : "") + ">အပိုင်း " + myNum(e.episode) + "</button>";
          }).join("") + "</div>"
        ) : "";

        views.reader.innerHTML =
          '<div class="reader-head">' +
            "<h2>" + esc(ep.title) + "</h2>" +
            '<div class="rsub">' + esc(s.name) + " · အပိုင်း " + myNum(ep.episode) + (ep.pages ? " · စာမျက်နှာ " + myNum(ep.pages) + " မျက်နှာ" : "") + "</div>" +
          "</div>" +
          '<div class="reader-frame"><iframe src="' + esc(ep.pdf_url) + '" title="' + esc(ep.title) + ' PDF reader" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>' +
          '<div class="reader-nav">' +
            '<button id="prevEp"' + (prev ? "" : " disabled") + '>' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>အရင်အပိုင်း</button>' +
            '<button id="nextEp" class="primary"' + (next ? "" : " disabled") + '>နောက်အပိုင်း' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>' +
          "</div>" +
          picker +
          /* ADS: reader အောက် banner — Mondiad Banner zone */
          '<div class="ad-slot filled" data-ad-slot="reader-banner"><div data-mndbanid="c3fa4e27-30eb-44ab-ae20-c5633485bd0f"></div></div>';

        showView("reader", ep.title);
        if (prev) $("prevEp").addEventListener("click", function () { requestRead(s.name, prev.episode); });
        if (next) $("nextEp").addEventListener("click", function () { requestRead(s.name, next.episode); });
        Array.prototype.forEach.call(views.reader.querySelectorAll(".ep-picker button"), function (b) {
          b.addEventListener("click", function () { requestRead(s.name, parseInt(b.getAttribute("data-ep"), 10)); });
        });
      }

      /* ---------- Routing ---------- */
      function route() {
        syncNav();
        var hash = currentHash();
        if (hash === lastRouted) return; /* hashchange + popstate နှစ်မျိုးလုံး လာလည်း တစ်ခါသာ render မည် */
        if (gatePending) closeGate(); /* Back ဖြင့် ရွေ့လျှင် ပွင့်နေသော gate popup ကို ပိတ်မည် (renderReader က လိုလျှင် ပြန်ဖွင့်မည်) */
        lastRouted = hash;
        var m;
        if ((m = hash.match(/^#\/series\/(.+)$/))) {
          var s = findSeries(decodeURIComponent(m[1]));
          if (s) { renderSeries(s); return; }
        }
        if ((m = hash.match(/^#\/read\/(.+)\/(\d+)$/))) {
          var s2 = findSeries(decodeURIComponent(m[1]));
          if (s2) { renderReader(s2, parseInt(m[2], 10)); return; }
        }
        showView("home", "");
      }
      window.addEventListener("hashchange", route);

      $("backBtn").addEventListener("click", function () {
        if (navStack.length > 1) {
          history.back(); /* popstate/hashchange → route: အရင်ကြည့်ခဲ့သော စာမျက်နှာသို့ ပြန်သွားမည် */
        } else if (views.reader.classList.contains("active") && current.series && !isOneShot(current.series)) {
          navigateTo("#/series/" + encodeURIComponent(current.series.name));
        } else if (!views.home.classList.contains("active")) {
          navigateTo("#/");
        }
        /* ပင်မစာမျက်နှာတွင်ဆိုလျှင် ခလုတ်မပြထားသောကြောင့် ဤ handler မရောက်ပါ —
           ဖုန်း Back နှိပ်လျှင် history entry မကျန်တော့၍ အက်ပ်မှ တန်းထွက်မည် */
      });

      $("search").addEventListener("input", function (e) {
        state.query = e.target.value;
        renderHome();
      });

      /* ---------- Toast ---------- */
      var toastTimer = null;
      function toast(msg) {
        var t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
      }

      /* ---------- Google Sheets မှ ဒေတာ ဖတ်ရန် ---------- */
      function loadSheet() {
        if (!SHEET_CSV_URL) {
          hideLoader();
          return;
        }
        fetch(SHEET_CSV_URL, { credentials: "omit" })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
          .then(function (text) {
            var list = rowsToSeries(parseCSV(text));
            if (list) {
              state.series = list;
              state.fromSheet = true;
              renderChips(); renderHome();
              lastRouted = null; /* ဒေတာအသစ်ဖြင့် လက်ရှိ စာမျက်နှာကို ပြန် render မည် */
              route();
            }
            hideLoader();
          })
          .catch(function () {
            hideLoader();
          });
      }

      /* ---------- Init ---------- */
      /* ပထမဆုံး history entry = လက်ရှိ စာမျက်နှာ (ပင်မ) သာ ဖြစ်သည် —
         loading overlay ကို history ထဲ မထည့်သောကြောင့် ၎င်းထံ ပြန်မရောက်ဘဲ
         ပင်မ၌ Back နှိပ်လျှင် အက်ပ်မှ တန်းထွက်မည်။
         replaceState ကိုပါ မသုံးပါ (file:// တွင် throw တတ်သည်) — hash မရှိလျှင်
         route() က ပင်မစာမျက်နှာအဖြစ် သတ်မှတ်ပြသည် */
      renderChips();
      renderHome();
      route();
      loadSheet();
    </script>
